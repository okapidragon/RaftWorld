<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Raft World</title>
<link rel="stylesheet" href="style.css">
<link rel="preload" href="https://pyscript.net/releases/2025.2.2/core.css" as="style">
<link rel="preload" href="https://pyscript.net/releases/2025.2.2/core.js" as="script" crossorigin="anonymous">
<link rel="stylesheet" href="https://pyscript.net/releases/2025.2.2/core.css" />
<script type="module" src="https://pyscript.net/releases/2025.2.2/core.js" crossorigin="anonymous"></script>
</head>
<body>
<div class="grid-container" style="height: 100vh;">
  <button id="pause-button">Pause</button>
  <div class="column" id="needs-col" style="height:100vh">
  <h3 style="text-align: center;">Stats</h3>
    <p id="time-display" style="text-align: center;">Time: 00:00</p>
    <div id="location" style="text-align: center;">
      <p id="location-text">Location: Freshwater Ocean</p>
    </div>
    <div class="boxed">
    <div class="bi-directional-container">
      <div class="center-line"></div>
      <div class="bi-bar-wrapper" id="balance-wrapper">
        <div class="bi-bar" id="balance-bar"></div>
      </div>
    </div>
    <div class="bar-labels" id="hunger-bar-labels">
        <span>-100%</span>
        <span>0%</span>
        <span>100%</span>
    </div>
    <br>
    <p id="hunger-title" class="bar-title" style="text-align: center;">Hunger level</p>
    </div>
    <div class="boxed">
    <div id="health-bar-container" style="margin-top: 10px; width: 100%; height: 24px; background-color: #e0e0e0; border-radius: 12px;">
      <div id="health-bar" style="width: 100%; height: 100%; background-color: #9b2525; border-radius: 12px;"></div>
    </div>
    <div class="bar-labels" id="health-bar-labels">
      <span>0%</span>
      <span>100%</span>
    </div>
    <p id="health-title" class="bar-title" style="text-align: center;">Health level</p>
    </div>
    <div class="boxed" id="decay-section" style="display:none;">
    <div id="decay-bar-container" style="margin-top: 10px; width: 100%; height: 24px; background-color: #e0e0e0; border-radius: 12px;">
      <div id="decay-bar" style="width: 100%; height: 100%; background-color: #615d5d; border-radius: 12px;"></div>
    </div>
    <div class="bar-labels" id="decay-bar-labels">
      <span>100%</span>
      <span>0%</span>
    </div>
    <p id="decay-title" class="bar-title" style="text-align: center;">Boat decay level</p>
    </div>
  </div>
  <div class="column" id="inventory-col">
    <h3 style="text-align: center;">Inventory</h3>
    <div id="inventory-display"></div>
    <div id="crafts-col" class="crafts-bottom" style="display: none;"></div>
  </div>
  <div class="column" id="tasks-col" style="height:100vh">
    <h3 style="text-align: center;">Tasks</h3>
    <div id="tasks-area"></div>
    <div id="boat-div" class="boxed" style="display:none">
    <div id="boat-col" class="center-flex">
      <h3>Boat</h3>
      <p style="font-size: large; font-weight: 400;" id="boat-size"></p>
      <p>You can salvage or use wood to make the boat smaller or bigger. Input the size below.</p>
      <div style="display:flex; gap:8px; align-items:center; justify-content:center;">
        <input type="number" id="boat-width" value="6" min="5" style="width:90px">
        <span>x</span>
        <input type="number" id="boat-height" value="6" min="5" style="width:90px">
      </div>
      <button id="resize-boat-button" style="display: block;margin-left: auto; margin-right: auto;">Change boat size</button>
    </div>
    </div>
  </div>
  <div class="column" id="output-col">
    <h3 style="text-align: center;">Messages</h3>
  </div>
    <div class="column" id="events-col">
      <div id="events-div" class="boxed" style="display: none"></div>
    </div>
</div>
<script type="py" src="storyManager.py" config='{"files":{
  "./imports.py":"imports.py",
  "./playerLogic.py":"playerLogic.py",
  "./inventoryLogic.py":"inventoryLogic.py",
  "./taskLogic.py":"taskLogic.py",
  "./storyManager.py":"storyManager.py",
  "./eventsLogic.py":"eventsLogic.py",
  "./items.py":"items.py"
}}' ></script>
</body>
</html>
