<!DOCTYPE html>
<html>
  <head>
  <meta charset="UTF-8">
  <title>Raft World</title>
  
  <style>
    .grid-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr); 
      gap: 20px; 
    }
    .column {
      padding: 10px;
    }
  </style>  
  </head>
  <body>
  <div class="grid-container">
    <div class="column"><h3>Tasks</h3></div>
    <div class="column"><h3>Events</h3></div>
    <div class="column"><h3>Inventory</h3></div>
    <div class="column"><h3>Output</h3></div>
  </div>  
  </body>
</html>
