<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Raft World</title>
<style>
.grid-container {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 20px;
}
button {
    border-radius: 100px;
    width: 50%;
    min-height: 2.5rem; 
    height: auto;
    background-color: rgb(176, 255, 244);
    border-color: rgb(0, 115, 247);
    font-size: 100%;
    margin-bottom: 20px

}
.column {
  padding: 10px;
}
.hunger-label {
  display: flex;
  justify-content: center;
  width: 100%;
  margin: 0 0 10px;
}
/* --- Zero-Centered Progress Bar Styles --- */
.bi-directional-container {
  position: relative;
  width: 100%;
  height: 24px;
  background-color: #e0e0e0;
  border-radius: 12px;
  margin-top: 10px;
  overflow: hidden;
}
.center-line {
  position: absolute;
  left: 50%;
  top: 0;
  width: 2px;
  height: 100%;
  background-color: #888;
  z-index: 2;
}
.bi-bar-wrapper {
  position: absolute;
  top: 0;
  height: 100%;
  width: 0%;
  transition: left 0.3s ease, width 0.3s ease;
}
.bi-bar {
  width: 100%;
  height: 100%;
}
.fill-negative {
  background-color: #f44336;
}
.fill-positive {
  background-color: #4caf50;
}
.bar-labels {
  display: flex;
  justify-content: space-between;
  margin-top: 6px;
  width: 100%;
}
.task-button.in-progress {
  background-color: rgb(0, 255, 0);
  color: rgb(0, 0, 0);
}
</style>
<link rel="stylesheet" href="https://pyscript.net/releases/2025.2.2/core.css" />
<script type="module" src="https://pyscript.net/releases/2025.2.2/core.js"></script>
</head>
<body>
<div class="grid-container">
  <div class="column" id="inventory-col">
    <h3 style="text-align: center;">Inventory</h3>
  </div>
  <div class="column" id="tasks-col">
    <h3 style="text-align: center;">Tasks</h3>
  </div>
  <div class="column" id="output-col">
    <h3 style="text-align: center;">Output</h3>
  </div>
  <div class="column" id="needs-col">
    <h3 style="text-align: center;">Stats</h3>
    <p id="time-display" style="text-align: center;">Time: 00:00</p>
    <p class="hunger-label" style="text-align: center;">Hunger level</p>
    <div class="bi-directional-container">
      <div class="center-line"></div>
      <div class="bi-bar-wrapper" id="balance-wrapper">
        <div class="bi-bar" id="balance-bar"></div>
      </div>
    </div>
    <div class="bar-labels">
        <span>-100%</span>
        <span>0%</span>
        <span>100%</span>
    </div>
    <br><br><br><br><br><br>
    <h3 style="text-align: center;">Boat</h3> 
    <p style="font-size: large; font-weight: 400; text-align: center;" id="boat-size"></p>
    <p style="text-align: center;">With more wood, you can make your boat larger. You can also make your boat smaller to gather wood. Enter the width and height you would like to grow it to in the text spaces below.</p>
    <div style="justify-self: center;">
    <input type="number" id="boat-width" value="6" min="5" style="width:90px">
    <span>x</span>
    <input type="number" id="boat-height" value="6" min="5" style="width:90px">
    </div>
    <br>
    <button id="resize-boat-button" style="display: block;margin-left: auto; margin-right: auto;">Change boat size</button>
</div>
    <div class="column" id="events-col">
      <h3 style="text-align: center;">Events</h3>
    </div>
  </div>
</div>
<script type="py" src="storyManager.py" config='{"files":{"./imports.py":"imports.py","./playerLogic.py":"playerLogic.py","./inventoryLogic.py":"inventoryLogic.py","./taskLogic.py":"taskLogic.py","./storyManager.py":"storyManager.py","./eventsLogic.py":"eventsLogic.py"}}' ></script>
</body>
</html>
