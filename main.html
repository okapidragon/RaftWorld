<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Raft World</title>
    <style>
        .grid-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        .column { padding: 10px; }
    </style>
    
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.2.2/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.2.2/core.js"></script>

    <script type="py-config">
    {
        "files": {
            "./imports.py": "imports.py",
            "./taskLogic.py": "taskLogic.py",
            "./inventoryLogic.py": "inventoryLogic.py",
            "./boatLogic.py": "boatLogic.py",
            "./storyManager.py": "storyManager.py"
        }
    }
    </script>
</head>
<body>

    <div class="grid-container">
        <div class="column" id="tasks-col"><h3>Tasks</h3></div>
        <div class="column" id="events-col"><h3>Events</h3></div>
        
        <div class="column" id="inventory-col">
            <h3>Inventory</h3>
            <p>Wood: <span id="wood-count">0</span></p>
        </div>
        
        <div class="column" id="output-col"><h3>Output</h3></div>
    </div>

    <script type="py" src="main.py"></script>
</body>
</html>
